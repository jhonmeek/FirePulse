# Production override: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
services:
  backend:
    volumes:
      - ./data:/data:ro
      - ./data/backups:/data/backups
      - ./docs:/docs:ro
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a strong DJANGO_SECRET_KEY in .env before running production}
      DJANGO_DEBUG: "false"
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://localhost}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://localhost}
      POSTGRES_CONN_MAX_AGE: ${POSTGRES_CONN_MAX_AGE:-60}
      API_CACHE_SECONDS: ${API_CACHE_SECONDS:-300}
      HTTP_CACHE_MAX_AGE: ${HTTP_CACHE_MAX_AGE:-60}
      DJANGO_USE_X_FORWARDED_HOST: "true"
      DJANGO_SESSION_COOKIE_SECURE: ${DJANGO_SESSION_COOKIE_SECURE:-true}
      DJANGO_CSRF_COOKIE_SECURE: ${DJANGO_CSRF_COOKIE_SECURE:-true}
      DJANGO_SECURE_HSTS_SECONDS: ${DJANGO_SECURE_HSTS_SECONDS:-31536000}
    command: >
      sh -c "python manage.py migrate --noinput &&
             gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers ${GUNICORN_WORKERS:-3} --timeout 120 --access-logfile -"

  proxy:
    image: caddy:2.8-alpine
    container_name: firepulse_proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      FIREPULSE_DOMAIN: ${FIREPULSE_DOMAIN:-localhost}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./frontend/dist:/srv/frontend:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      backend:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
