services:
  db:
    image: postgis/postgis:16-3.4
    container_name: firepulse_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firepulse}
      POSTGRES_USER: ${POSTGRES_USER:-firepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firepulse_dev}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-firepulse} -d ${POSTGRES_DB:-firepulse}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: firepulse_backend
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-firepulse}
      POSTGRES_USER: ${POSTGRES_USER:-firepulse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-firepulse_dev}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-dev-only-change-before-production}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      API_CACHE_SECONDS: ${API_CACHE_SECONDS:-300}
      HTTP_CACHE_MAX_AGE: ${HTTP_CACHE_MAX_AGE:-60}
    volumes:
      - ./backend:/app
      - ./data:/data
      - ./docs:/docs
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health/').read()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py runserver 0.0.0.0:8000"

volumes:
  postgres_data:
