name: FirePulse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - back_geo_infra

jobs:
  backend:
    name: Backend (PostGIS + Django API v1)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: firepulse
          POSTGRES_USER: firepulse
          POSTGRES_PASSWORD: firepulse_dev
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U firepulse -d firepulse"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install GDAL and GEOS system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            binutils \
            gdal-bin \
            libgdal-dev \
            libgeos-dev \
            libproj-dev \
            libpq-dev

      - name: Install Python dependencies
        run: pip install --no-cache-dir -r backend/requirements.txt

      - name: Validate API contract JSON
        run: python -c "import json; json.load(open('docs/api-contract.json', encoding='utf-8'))"

      - name: Run Django checks and PostGIS test suite
        working-directory: backend
        env:
          POSTGRES_HOST: localhost
          POSTGRES_PORT: "5432"
          POSTGRES_DB: firepulse
          POSTGRES_USER: firepulse
          POSTGRES_PASSWORD: firepulse_dev
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          python manage.py test -v 2

  pipeline-m1:
    name: M1 Pipeline Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install geographic test dependency
        run: python -m pip install -r pipeline/requirements-geo.txt

      - name: Run M1 unittest suite
        run: python -m unittest discover -s tests -v

  front-bis:
    name: Front-bis (tests + type-check + build)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: front-bis/package-lock.json

      - name: Install dependencies
        working-directory: front-bis
        run: npm ci

      - name: Run unit tests
        working-directory: front-bis
        run: npm run test:unit -- --run

      - name: Type-check and build
        working-directory: front-bis
        run: npm run build
